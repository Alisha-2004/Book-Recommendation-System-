<!DOCTYPE html>
<html>
<head>
    <title>Book Recommendations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4 title-heading">📖 Recommended Books for You</h1>
        <div class="row g-4">
            {% for book in books %}
            <div class="col-md-4">
                <div class="book-card p-3 shadow-sm rounded">
                    <h5 class="fw-bold">{{ book['title'] }}</h5>
                    <p class="text-muted">by {{ book['authors'] }}</p>
                    <span class="badge bg-warning text-dark">⭐ {{ book['average_rating'] }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-primary">🔙 Search Again</a>
        </div>
    </div>
</body>
</html>
