<!DOCTYPE html>
<html>
<head>
    <title>Book Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4 title-heading">📚 Discover Your Next Favorite Book</h1>
        <div class="form-container shadow-lg p-4 rounded">
            <form method="POST" action="/recommend">
                <div class="mb-3">
                    <label class="form-label">Average Rating ⭐</label>
                    <input type="text" name="rating" class="form-control" placeholder="e.g. 4.5">
                </div>
                <div class="mb-3">
                    <label class="form-label">Number of Reviews 🗣</label>
                    <input type="text" name="reviews" class="form-control" placeholder="e.g. 1200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Number of Pages 📖</label>
                    <input type="text" name="pages" class="form-control" placeholder="e.g. 350">
                </div>
                <button type="submit" class="btn btn-primary w-100">✨ Recommend Books</button>
            </form>
        </div>
    </div>
</body>
</html>
